# LocalLead AI — Lighthouse Performance Audit CI
# Runs automated Lighthouse audits on every production deployment
# Fails if performance drops below configured thresholds.

name: Lighthouse Performance Audit

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to audit'
        required: true
        default: 'https://locallead.pages.dev'

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.deployment_status.state == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            ${{ github.event.deployment_status.target_url || github.event.inputs.url }}
          budgetPath: ./.github/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Comment Lighthouse Results on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## ⚡ Lighthouse Audit Complete\n\nAudit results uploaded to temporary public storage.\n\nTarget URL: ${{ github.event.deployment_status.target_url || github.event.inputs.url }}`
            });
