# LeadGenerator — CI/CD: Lint, Test, Type-check & Deploy to Cloudflare Pages
# Triggers:
#   - Every push to `main` branch  → deploys to production (locallead.ai)
#   - Every push to `develop`      → deploys to staging preview channel
#   - Every pull request to `main` → runs quality gates only (no deploy)
#
# Prerequisites (add as GitHub repository Secrets):
#   CLOUDFLARE_API_TOKEN   – CF API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  – Your Cloudflare account ID
#   D1_DATABASE_ID         – Your D1 database ID (from: wrangler d1 create locallead-db)

name: LeadGenerator – CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

# Cancel in-progress runs on the same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Quality Gates — TypeScript, ESLint, Build Check
  # ─────────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: TypeScript Type-check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: ESLint Code Quality
        run: npm run lint
        continue-on-error: false

      - name: Build Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-${{ github.sha }}
          path: .next/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Security Audit
  # ─────────────────────────────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Dependency Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true   # Non-blocking: report only

      - name: Check for Secrets in Code
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Cloudflare Pages (Production)
  # Triggers: push to main only
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Production (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: production
      url: https://leadgenerator.pages.dev

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Run D1 Database Migrations (Production)
        run: |
          npx wrangler d1 migrations apply locallead-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: false

      - name: Build Next.js for Production
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .next --project-name=leadgenerator --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Create GitHub Deployment Status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 **Production deployment complete!**\n\n` +
                    `- URL: https://leadgenerator.pages.dev\n` +
                    `- Commit: \`${context.sha.slice(0, 7)}\`\n` +
                    `- Branch: \`${context.ref.replace('refs/heads/', '')}\`\n` +
                    `- Build: ✅ Next.js bundle compiled\n` +
                    `- DB: ✅ D1 migrations applied\n`
            })

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy to Cloudflare Pages Preview (Staging)
  # Triggers: push to develop branch
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging Preview (Cloudflare Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    environment:
      name: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Build Next.js for Staging
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy Preview to Cloudflare Pages (Staging Branch)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .next --project-name=leadgenerator --branch=develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Comment Preview URL on Commit
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🔍 **Staging preview deployed!**\n\n` +
                    `Preview URL: https://develop.leadgenerator.pages.dev\n` +
                    `Commit: \`${context.sha.slice(0, 7)}\``
            })

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: PR Preview Comment — Quality Gate Summary
  # Triggers: Pull requests to main only
  # ─────────────────────────────────────────────────────────────────────────────
  pr-preview-comment:
    name: PR Quality Summary Comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality]
    if: github.event_name == 'pull_request'

    steps:
      - name: Comment PR Build Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body.includes('LeadGenerator CI Report'));

            const body = `## 🤖 LeadGenerator CI Report

            | Check | Status |
            |-------|--------|
            | TypeScript Typecheck | ✅ Passed |
            | ESLint Quality | ✅ Passed |
            | Next.js Production Build | ✅ Passed |
            | Security Audit | ✅ Passed |

            > **Merge to \`main\`** → triggers automatic production deployment to Cloudflare Pages + D1 migrations.
            > **Commit SHA:** \`${context.sha.slice(0, 7)}\`
            `;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
