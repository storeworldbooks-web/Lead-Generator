name = "leadgenerator"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".next"

[vars]
NEXT_PUBLIC_APP_NAME = "LeadGenerator"
NEXT_PUBLIC_APP_TAGLINE = "B2B Local Lead Harvesting & Opportunity Scanner"
MAX_HARVEST_LIMIT = "100"
ENABLE_MOCK_FALLBACK = "true"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "leadgenerator-db"
database_id = "00000000-0000-0000-0000-000000000000" # Replace with your D1 database ID from 'wrangler d1 create leadgenerator-db'
migrations_dir = "./migrations"

# Cloudflare Turnstile Configuration
# Obtain sitekey and secret from Cloudflare Dashboard -> Turnstile
[vars.turnstile]
# Dummy/test keys: 1x00000000000000000000AA (always passes)
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
